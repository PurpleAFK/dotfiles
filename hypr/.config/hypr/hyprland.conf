exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# source = ~/.config/hypr/colors.conf
source = ~/.cache/wal/colors-hyprland

################
### MONITORS ###
################
monitor = eDP-1, 1920x1080@144, 0x0, 1
monitor = DP-2, disabled

workspace = 1,monitor:eDP-1
workspace = 2,monitor:eDP-1
workspace = 3,monitor:eDP-1
workspace = 4,monitor:eDP-1
workspace = 5,monitor:eDP-1
workspace = 6,monitor:eDP-1
workspace = 7,monitor:eDP-1
workspace = 8,monitor:DP-1
workspace = 9,monitor:DP-1
workspace = 10,monitor:DP-1


###################
### MY PROGRAMS ###
###################
#$themes = bash ~/Documents/themes/theme-switcher.sh
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun
$powermenu = zsh ~/.config/rofi/powermenu.sh
$screenshot = hyprshot -m output -m active --clipboard-only
$hyprlock = hyprlock
$killpanel = killall waybar
$startpanel = waybar
$notes = flatpak run md.obsidian.Obsidian


#################
### AUTOSTART ###
#################
# exec-once=hyprpaper
exec-once = swww-daemon &
exec-once = ~/.config/hypr/scripts/wallpapers.sh startup
# exec-once=waybar

# Load the last set wallpaper on startup
# This command sources a script that sets the wallpaper and applies Pywal colors
#exec-once= ~/.config/hypr/set_startup_wallpaper.sh

# Restore Pywal colors for other applications (like the terminal) on startup
#exec-once = wal -R

###################
### KEYBINDINGS ###
###################
$mainMod = SUPER 

#scripts

# Example: Super + Shift + W to open a file picker and set wallpaper/theme
# bind = $mainMod SHIFT, W, exec, wofi --show files "$HOME/Pictures/Wallpapers" | xargs ~/bin/set_wal_and_kitty.sh
# bind = $mainMod, W, exec, ~/.config/scripts/wallpaper-chooser.sh
bind = alt, W, exec, ~/.local/bin/wal-set.sh



# This example uses 'wofi' (a Wayland dmenu replacement) to pick a file.
# Ensure 'wofi' is installed if you use this. Adjust path if your wallpapers are elsewhere.

bind = alt, C, exec, $themes
bind = alt, return, exec, $terminal
bind = alt, Q, killactive,
bind = $mainMod, M, exit
bind = alt, F, fullscreen
bind = $mainMod, E, exec, $fileManager
bind = alt, N, exec, ~/.config/scripts/rofi-notes.sh
bind = alt, R, exec, $reader
bind = $mainMod, F, togglefloating,
bind = alt, D, exec, $menu
bind = alt, Z, exec, $powermenu
bind = alt, S, togglesplit, 
bind = alt, H, movefocus, l
bind = alt, L, movefocus, r
bind = alt, K, movefocus, u
bind = alt, J, movefocus, d
bind = alt, P, exec, $screenshot
bind = $mainMod, L, exec, $hyprlock
bind = $mainMod, K, exec, $killpanel
bind = $mainMod, J, exec, $startpanel
bind = alt, 1, workspace, 1
bind = alt, 2, workspace, 2
bind = alt, 3, workspace, 3
bind = alt, 4, workspace, 4
bind = alt, 5, workspace, 5
bind = ctrl, 1, workspace, 6
bind = ctrl, 2, workspace, 7
bind = ctrl, 3, workspace, 8
bind = ctrl, 4, workspace, 9
bind = ctrl, 5, workspace, 10
bind = $mainMod, 1, movetoworkspace, 1
bind = $mainMod, 2, movetoworkspace, 2
bind = $mainMod, 3, movetoworkspace, 3
bind = $mainMod, 4, movetoworkspace, 4
bind = $mainMod, 5, movetoworkspace, 5
bind = ctrl+shift, 1, movetoworkspace, 6
bind = ctrl+shift, 2, movetoworkspace, 7
bind = ctrl+shift, 3, movetoworkspace, 8
bind = ctrl+shift, 4, movetoworkspace, 9
bind = ctrl+shift, 5, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = alt, mouse:272, movewindow
bindm = alt, mouse:273, resizewindow
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous



#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
exec-once=hyprctl setcursor hypr-dots 24

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 15
    border_size = 0
    resize_on_border = false
    allow_tearing = false
    layout = master
}

decoration {
    rounding = 8
    active_opacity = 1
    inactive_opacity = 1
    shadow {
        enabled = false
        range = 25
        render_power = 1000
        color = rgb(689d6a)
        color = rgb(ebdbb2)
    }
    blur {
        enabled = true
        size = 1
        passes = 5

        vibrancy = 0.1696
    }
}
animations {
    enabled = yes, please :)
        bezier = wind, 0.05, 0.9, 0.1, 1.05
        bezier = winIn, 0.1, 1.1, 0.1, 1.1
        bezier = winOut, 0.3, -0.3, 0, 1
        bezier = liner, 1, 1, 1, 1
        bezier = overshot, 0.05, 0.9, 0.1, 1.05
        bezier = smoothOut, 0.5, 0, 0.99, 0.99
        bezier = smoothIn, 0.5, -0.5, 0.68, 1.5
        bezier = easeOutQuint,0.23,1,0.32,1
        bezier = easeInOutCubic,0.65,0.05,0.36,1 
        bezier = linear,0,0,1,1
        bezier = almostLinear,0.5,0.5,0.75,1.0
        bezier = quick,0.15,0,0.1,1
        animation = windows, 1, 6, wind, slide
        animation = windowsIn, 1, 5, winIn, slide
        animation = windowsOut, 1, 3, smoothOut, slide
        animation = windowsMove, 1, 5, wind, slide
        animation = border, 1, 1, liner
        animation = borderangle, 1, 180, liner, loop 
        animation = fade, 1, 3, smoothOut
        animation = workspaces, 1, 5, overshot
        animation = workspacesIn, 1, 5, winIn, slide
        animation = workspacesOut, 1, 5, winOut, slide
        animation = layers, 1, 3.81, easeOutQuint 
        animation = layersIn, 1, 4, easeOutQuint, popin 50%
        animation = layersOut, 1, 3, easeOutQuint, slide
}

dwindle {
    pseudotile = true 
    preserve_split = true 
}

# master {
#     new_status = master
# }

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

#############
### INPUT ###
#############

input {
    kb_layout = us,br
    kb_variant =
    kb_model =
    kb_options = grp:ctrl_space_toggle
    kb_rules =
    accel_profile = flat
    follow_mouse = 1
    sensitivity = 0.8 
    touchpad {
        natural_scroll = false
    }
}
gestures {
    workspace_swipe = false
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
 
