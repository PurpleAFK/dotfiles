$font = JetBrainsMono Nerd Font

# --- General Settings ---
general {
    disable_loading_bar = true
    hide_cursor = true
}

# --- Background ---
# This section sets the background to your current wallpaper.
# Pywal creates a symbolic link to the current wallpaper at this path.
background {
    monitor =                 # Apply to all monitors
    path = screenshot 
    blur_passes = 3           # Number of blur passes. Higher is blurrier, but more performance intensive.
    blur_size = 7             # Blur radius.
    noise = 0.0117            # Adds a subtle noise effect to the blur.
    # Fallback color if the image path is not valid.
    color = rgb(1e1e2e)       # Using a default dark color as a fallback.
}

# --- Clock Label ---
# Displays the time in the center of the screen, slightly above the middle.
label {
    monitor =                 # Apply to all monitors
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(cba6f7)       # A vibrant color for the text, adjust as needed.
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 40        # Offset: 0 horizontal, 150 pixels up from center.
    halign = center
    valign = center
}

# --- Date Label ---
# Displays the date in the middle of the screen.
label {
    monitor =                 # Apply to all monitors
    text = cmd[update:3600000] date +"%A, %B %d, %Y"
    color = rgb(cba6f7)       # Same vibrant color for consistency.
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, -40          # Offset: 0 horizontal, 30 pixels up from center.
    halign = center
    valign = center
}

# --- Input Field ---
# The password input field, placed at the bottom of the stack.
input-field {
    monitor =                 # Apply to all monitors
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(cba6f7) # Border color
    inner_color = rgb(1e1e2e) # Inner background color
    font_color = rgb(cba6f7)  # Text/dot color
    fade_on_empty = false
    placeholder_text = Guess me ;)
    hide_input = false        # Show password dots
    check_color = rgb(a6e3a1) # Color on success (green)
    fail_color = rgb(f38ba8)  # Color on failure (red)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(f9e2af) # Color when CapsLock is active (yellow)
    position = 0, -120          # Offset: 0 horizontal, 50 pixels down from center.
    halign = center
    valign = center
}

